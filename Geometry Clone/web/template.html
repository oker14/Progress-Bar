<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Geometry Clone</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1020; color: #dfe6ff; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { display: grid; grid-template-rows: 1fr 318px; height: 100%; }
  #c { width: 100%; height: 100%; display: block; contain: strict; }
  #panel { box-sizing: border-box; height: 318px; padding: 6px 12px; background: #070914; border-top: 1px solid #263; overflow: hidden; contain: strict; }
  #stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0 12px; height: 74px; overflow: hidden; }
  #stats span b { color: #ffd84a; font-weight: normal; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 4px; }
  select { background: #1c2450; color: #dfe6ff; border: 1px solid #3a4890; border-radius: 6px; padding: 3px 6px; font: inherit; }
  button { background: #1c2450; color: #dfe6ff; border: 1px solid #3a4890; border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button.on { background: #3a4890; border-color: #8fa2ff; }
  #tests { height: 130px; overflow: auto; font-size: 12px; }
  .pass { color: #5f5; } .fail { color: #f55; } .dim { color: #7f8bb8; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="panel">
    <div id="stats"></div>
    <div class="row" id="speeds"></div>
    <div class="row">
      <button id="reset">Reset (R)</button><button id="pause">Pause (P)</button><button id="slow">Slow-mo (S)</button>
      <button id="qual">Quality: High (Q)</button><button id="test">Self-tests</button>
      <span class="dim">SPACE / click / touch = jump (hold to re-jump)</span>
    </div>
    <div class="row">
      <button id="cbf">Click-between-frames: on (C)</button>
      <button id="extrap">Extrapolation: Smooth (E)</button>
      <label class="dim">Render FPS <select id="cap"></select> <input id="capn" type="number" min="1" max="100000" step="1" placeholder="custom" style="width:76px;background:#1c2450;color:#dfe6ff;border:1px solid #3a4890;border-radius:6px;padding:3px 6px;font:inherit"></label>
      <span class="dim">physics is always 240 Hz</span>
    </div>
    <div id="tests"></div>
  </div>
</div>
<script>
// Single self-contained file: physics is the Rust core compiled to WASM, inlined below.
const WASM_B64 = "__WASM_B64__";
const GOLDEN_PARITY_HASH = "__GOLDEN_HASH__";   // native result of the parity script (scripts/golden.json)
const PARITY_TICKS = __PARITY_TICKS__;
const TICK_HZ = 240, TICK_MS = 1000 / TICK_HZ, UPB = 30, WIKI_JUMP = 2.1333;   // physics rate is FIXED at 240 Hz
const SPEED_LABELS = ["0.5x", "1x", "2x", "3x", "4x"];
const SPEED_BPS = [0.7 * 5.98, 0.9 * 5.77, 1.1 * 5.87, 1.3 * 6.0, 1.6 * 6.0].map(v => v * 60 / UPB);   // display only
// Reference cube jump table (docs/03-cube-physics.md): [apex blocks, air ticks, distance blocks]
const JUMP_REF = [[1.955, 100, 3.49], [2.128, 103, 4.457], [2.232, 106, 5.70], [2.147, 103, 6.69], [2.147, 103, 8.24]];
const MAX_CATCHUP_MS = 100;   // never try to "catch up" more than this (tab was hidden / slow frame)
const TRAIL_MAX = 160, TRAIL_EVERY = 4;   // keep every 4th tick (60 Hz) -> at most 160 points
const CAPS = [[0, 'Unlimited (display rate)'], [30, '30'], [60, '60'], [90, '90'], [120, '120'], [144, '144'], [165, '165'], [240, '240'], [360, '360'], [480, '480'], [1000, '1000']];
const EXTRAP = ['Off', 'Smooth'];   // Smooth: extrapolate to the current time only (less than one tick ahead)

const $ = id => document.getElementById(id);
function b64ToBytes(b64) { const bin = atob(b64), o = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i); return o; }
const hex = (w, i) => (BigInt(w.gd_hash_hi(i) >>> 0) << 32n | BigInt(w.gd_hash_lo(i) >>> 0)).toString(16).padStart(16, '0');

// ---------------------------------------------------------------------------------------------
// Input/clock pipeline. Physics ticks are due every 1000/240 ms of wall time; this class decides
// WHEN each tick runs and WHICH input state it sees. It knows nothing about rendering.
//   cbf = true  (click-between-frames): an input event is applied at its own timestamp -- ticks up to
//         the event run with the old input, ticks after it with the new one (like GD's CBF).
//   cbf = false (vanilla): input is only sampled at frame start; every tick of that frame sees it.
// ---------------------------------------------------------------------------------------------
class Pipeline {
  constructor(onTick, t0) { this.onTick = onTick; this.cbf = true; this.held = false; this.pending = null; this.pendingTs = 0;
    this.paused = false; this.stepMs = TICK_MS; this.simNext = t0; this.lag = 0; this.firstHeldTick = -1; this.ticks = 0; }
  advanceTo(t) {
    if (this.paused) { this.simNext = t; return 0; }
    if (t - this.simNext > MAX_CATCHUP_MS) this.simNext = t - this.stepMs;      // resync after a stall instead of spiralling
    let n = 0;
    while (this.simNext <= t) { if (this.held && this.firstHeldTick < 0) this.firstHeldTick = this.ticks; this.onTick(this.held); this.simNext += this.stepMs; this.ticks++; n++; }
    return n;
  }
  // `ts` = event timestamp, `now` = current time (both ms, same clock)
  setHeld(v, ts, now) {
    if (this.cbf) {
      if (this.held === v) return;
      const t = Math.min(ts, now);
      this.advanceTo(t); this.held = v; this.lag = now - t;
    } else { this.pending = v; this.pendingTs = Math.min(ts, now); }
  }
  beginFrame(now) {
    if (!this.cbf && this.pending !== null) { if (this.held !== this.pending) this.lag = now - this.pendingTs; this.held = this.pending; this.pending = null; }
    return this.advanceTo(now);
  }
  // Wall-clock time of the most recent simulated tick
  get lastTickTime() { return this.simNext - this.stepMs; }
}

(async () => {
  let w;
  try { w = (await WebAssembly.instantiate(b64ToBytes(WASM_B64), {})).instance.exports; }
  catch (e) { window.__GD_RESULT__ = { error: String(e) }; $('stats').textContent = 'WASM failed: ' + e; return; }

  // ---------- game state ----------
  const SIM = 1;                                   // sim slot used by the player; slot 0 = self-tests
  let speed = 1, slow = false, lowQ = false, extrapMode = 1, fpsCap = 0, nextRenderAt = 0;
  let maxY = 0, lastApex = -1, airTicks = 0, lastAir = -1, wasGround = true, jumps = 0, sinceTrail = 0;
  const trailX = new Float32Array(TRAIL_MAX), trailY = new Float32Array(TRAIL_MAX); let trailN = 0, trailHead = 0;
  // perf counters
  let fpsAcc = 0, fpsN = 0, worstMs = 0, simMsAcc = 0, drawMsAcc = 0, ticksAcc = 0, lastFrame = performance.now(), tpsStart = performance.now(), tpsTicks = 0;
  let perf = { frameMs: 16.7, fps: 60, simMs: 0, drawMs: 0, ticksPerFrame: 4, worstMs: 0, inputLagMs: 0, tps: 240 };

  function tickOnce(held) {
    w.gd_step(SIM, held ? 1 : 0); tpsTicks++;
    const y = w.gd_y(SIM), g = w.gd_on_ground(SIM) === 1;
    if (!g) {
      airTicks++; if (y > maxY) maxY = y;
      if (++sinceTrail >= TRAIL_EVERY) { sinceTrail = 0; trailX[trailHead] = w.gd_x(SIM); trailY[trailHead] = y; trailHead = (trailHead + 1) % TRAIL_MAX; if (trailN < TRAIL_MAX) trailN++; }
    }
    if (g && !wasGround) { lastApex = maxY / UPB; lastAir = airTicks; maxY = 0; jumps++; }
    if (wasGround && !g) { airTicks = 1; maxY = y; trailN = 0; trailHead = 0; sinceTrail = 0; }
    if (g && wasGround) airTicks = 0;
    wasGround = g;
  }
  const pipe = new Pipeline(tickOnce, performance.now());
  window.__GD_PIPE__ = pipe;

  // ---------- canvas (opaque + low latency hint) ----------
  const canvas = $('c');
  let ctx = canvas.getContext('2d', { alpha: false, desynchronized: true }) || canvas.getContext('2d');
  let W = 1, H = 1, ppu = 1, groundY = 0, scale = 1, bg = null;
  function resize() {
    const r = canvas.getBoundingClientRect();
    scale = Math.min(devicePixelRatio || 1, 1.5) * (lowQ ? 0.6 : 1);
    W = Math.max(1, Math.round(r.width * scale)); H = Math.max(1, Math.round(r.height * scale));
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    ppu = Math.min(W, H * 1.6) / 240; groundY = Math.round(H * 0.78);
    buildBackground();
  }
  // Everything that does not move is drawn once into an offscreen canvas and blitted per frame.
  function buildBackground() {
    bg = document.createElement('canvas'); bg.width = W; bg.height = H; const g = bg.getContext('2d', { alpha: false });
    g.fillStyle = '#141a3a'; g.fillRect(0, 0, W, H); g.fillStyle = '#0a0e24'; g.fillRect(0, groundY, W, H - groundY);
    g.font = Math.max(9, 11 * scale) + 'px monospace'; g.lineWidth = Math.max(1, scale);
    for (let gy = 0; gy <= 6; gy++) {
      const y = Math.round(groundY - gy * UPB * ppu) + 0.5;
      g.strokeStyle = gy === 0 ? '#fff' : 'rgba(255,255,255,0.08)'; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
      g.fillStyle = '#6b7ab8'; g.fillText(gy + ' blk', 4 * scale, y - 3 * scale);
    }
    const yw = Math.round(groundY - WIKI_JUMP * UPB * ppu) + 0.5;
    g.setLineDash([6 * scale, 6 * scale]); g.strokeStyle = '#ff6'; g.beginPath(); g.moveTo(0, yw); g.lineTo(W, yw); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#ff6'; g.fillText('wiki jump 2.1333', W - 125 * scale, yw - 3 * scale);
  }
  addEventListener('resize', resize); resize();

  function reset() { w.gd_reset(SIM, 0, speed); maxY = 0; lastApex = -1; lastAir = -1; airTicks = 0; wasGround = true; jumps = 0; trailN = 0; trailHead = 0; sinceTrail = 0; pipe.simNext = performance.now(); pipe.firstHeldTick = -1; pipe.ticks = 0; }

  // ---------- UI ----------
  SPEED_LABELS.forEach((label, v) => { const b = document.createElement('button'); b.textContent = label; b.dataset.v = v; b.onclick = () => { speed = v; reset(); refresh(); }; $('speeds').appendChild(b); });
  CAPS.forEach(([v, label]) => { const o = document.createElement('option'); o.value = v; o.textContent = label; $('cap').appendChild(o); });
  $('cap').onchange = () => { fpsCap = +$('cap').value; nextRenderAt = 0; $('capn').value = ''; $('cap').blur(); };
  // any value works: 1..100000. Above the display's refresh rate a browser still shows one frame per refresh.
  $('capn').oninput = () => { const v = Math.floor(+$('capn').value); if (v >= 1) { fpsCap = Math.min(v, 100000); nextRenderAt = 0; } };
  $('capn').onkeydown = e => e.stopPropagation();   // typing digits must not trigger speed hotkeys
  function refresh() {
    [...$('speeds').children].forEach(b => b.classList.toggle('on', +b.dataset.v === speed));
    $('pause').classList.toggle('on', pipe.paused); $('slow').classList.toggle('on', slow);
    $('qual').textContent = 'Quality: ' + (lowQ ? 'Low' : 'High') + ' (Q)'; $('qual').classList.toggle('on', lowQ);
    $('cbf').textContent = 'Click-between-frames: ' + (pipe.cbf ? 'on' : 'off') + ' (C)'; $('cbf').classList.toggle('on', pipe.cbf);
    $('extrap').textContent = 'Extrapolation: ' + EXTRAP[extrapMode] + ' (E)'; $('extrap').classList.toggle('on', extrapMode > 0);
  }
  const togglePause = () => { pipe.paused = !pipe.paused; refresh(); };
  const toggleSlow = () => { slow = !slow; pipe.stepMs = slow ? TICK_MS * 10 : TICK_MS; refresh(); };
  const toggleQual = () => { lowQ = !lowQ; resize(); refresh(); };
  const toggleCbf = () => { pipe.cbf = !pipe.cbf; pipe.pending = null; refresh(); };
  const cycleExtrap = () => { extrapMode = (extrapMode + 1) % EXTRAP.length; refresh(); };
  $('reset').onclick = reset; $('pause').onclick = togglePause; $('slow').onclick = toggleSlow; $('qual').onclick = toggleQual; $('cbf').onclick = toggleCbf; $('extrap').onclick = cycleExtrap;
  const press = e => pipe.setHeld(true, e.timeStamp, performance.now());
  const release = e => pipe.setHeld(false, e.timeStamp, performance.now());
  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); press(e); }
    else if (e.code === 'KeyR') reset(); else if (e.code === 'KeyP') togglePause(); else if (e.code === 'KeyS') toggleSlow(); else if (e.code === 'KeyQ') toggleQual();
    else if (e.code === 'KeyC') toggleCbf(); else if (e.code === 'KeyE') cycleExtrap();
    else if (e.code >= 'Digit1' && e.code <= 'Digit5') { speed = +e.code.slice(5) - 1; reset(); refresh(); }
  });
  addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') release(e); });
  canvas.addEventListener('pointerdown', press, { passive: true });
  addEventListener('pointerup', release, { passive: true });
  addEventListener('pointercancel', release, { passive: true });
  addEventListener('blur', () => pipe.setHeld(false, performance.now(), performance.now()));
  document.addEventListener('visibilitychange', () => { pipe.simNext = performance.now(); lastFrame = pipe.simNext; });

  // stats: fixed set of nodes, text only rewritten when it changes, at ~8 Hz
  const keys = ['tick', 'time', 'distance', 'x speed', 'height', 'y velocity', 'on ground', 'last apex', 'air time', 'jumps', 'hash', 'render fps', 'physics rate', 'sim / draw', 'ticks/frame', 'worst frame', 'input->sim'];
  const valEl = {}; keys.forEach(k => { const s = document.createElement('span'); s.append(k + ': '); const b = document.createElement('b'); s.append(b); $('stats').append(s); valEl[k] = b; });
  const prevTxt = {}; function put(k, v) { if (prevTxt[k] !== v) { prevTxt[k] = v; valEl[k].textContent = v; } }
  function updateStats() {
    const t = w.gd_tick(SIM);
    put('tick', t); put('time', (t / TICK_HZ).toFixed(3) + ' s'); put('distance', (w.gd_x(SIM) / UPB).toFixed(2) + ' blk');
    put('x speed', SPEED_BPS[speed].toFixed(3) + ' blk/s'); put('height', (w.gd_y(SIM) / UPB).toFixed(3) + ' blk'); put('y velocity', w.gd_vy(SIM).toFixed(3));
    put('on ground', w.gd_on_ground(SIM) ? 'yes' : 'no');
    put('last apex', lastApex < 0 ? '-' : lastApex.toFixed(4) + ' (' + (lastApex - WIKI_JUMP >= 0 ? '+' : '') + (lastApex - WIKI_JUMP).toFixed(4) + ')');
    put('air time', lastAir < 0 ? '-' : lastAir + ' ticks'); put('jumps', jumps); put('hash', hex(w, SIM));
    put('render fps', perf.fps.toFixed(0) + ' (' + perf.frameMs.toFixed(1) + ' ms)'); put('physics rate', perf.tps.toFixed(1) + ' Hz' + (slow ? ' (slow-mo)' : '') + (pipe.paused ? ' (paused)' : ''));
    put('sim / draw', perf.simMs.toFixed(2) + ' / ' + perf.drawMs.toFixed(2) + ' ms');
    put('ticks/frame', perf.ticksPerFrame.toFixed(1)); put('worst frame', perf.worstMs.toFixed(1) + ' ms'); put('input->sim', pipe.lag.toFixed(1) + ' ms');
  }

  // ---------- drawing: one blit + one grid path + one trail path + one rect ----------
  // Visual position = real sim state + extrapolation. The sim itself is never touched by this.
  function draw(tRender) {
    let a = 0;                                                    // ticks past the last simulated tick
    if (extrapMode > 0 && !pipe.paused) a = Math.max(0, (tRender - pipe.lastTickTime) / pipe.stepMs);
    const px = a ? w.gd_extrap_x(SIM, a) : w.gd_x(SIM), py = a ? w.gd_extrap_y(SIM, a) : w.gd_y(SIM);
    ctx.drawImage(bg, 0, 0);
    const camX = px - W * 0.25 / ppu, step = UPB * ppu;
    if (!lowQ) {
      ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = Math.max(1, scale); ctx.beginPath();
      for (let gx = Math.floor(camX / UPB) * UPB; ; gx += UPB) { const x = Math.round((gx - camX) * ppu) + 0.5; if (x > W) break; ctx.moveTo(x, 0); ctx.lineTo(x, groundY); }
      ctx.stroke();
      if (trailN > 1) {
        ctx.strokeStyle = '#4af'; ctx.lineWidth = 2 * scale; ctx.beginPath(); const half = 15 * ppu;
        for (let i = 0; i < trailN; i++) { const k = (trailHead - trailN + i + TRAIL_MAX * 2) % TRAIL_MAX; const x = (trailX[k] - camX) * ppu + half, y = groundY - trailY[k] * ppu - half; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
      }
    }
    const cx = Math.round((px - camX) * ppu), cy = Math.round(groundY - py * ppu - step), sz = Math.round(step);
    ctx.fillStyle = '#ffd84a'; ctx.fillRect(cx, cy, sz, sz);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2 * scale; ctx.strokeRect(cx, cy, sz, sz);
  }

  // ---------- main loop: render rate is independent of physics ----------
  let statAt = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (fpsCap > 0) {                                             // software render-rate cap (browser can't exceed the display rate)
      const interval = 1000 / fpsCap;
      if (now < nextRenderAt - 1) return;
      nextRenderAt = Math.max(nextRenderAt + interval, now - interval);
    }
    const t0 = performance.now();
    const tSim = Math.min(now, t0);                               // rAF timestamp can be slightly ahead of now()
    const n = pipe.beginFrame(tSim);
    const t1 = performance.now();
    draw(tSim);
    const t2 = performance.now();
    const fdt = now - lastFrame; lastFrame = now;
    if (fdt > 0 && fdt < 1000) { fpsAcc += fdt; fpsN++; if (fdt > worstMs) worstMs = fdt; }
    simMsAcc += t1 - t0; drawMsAcc += t2 - t1; ticksAcc += n;
    if (now - statAt > 125) {
      if (fpsN) { const tt = performance.now(); perf = { frameMs: fpsAcc / fpsN, fps: 1000 * fpsN / fpsAcc, simMs: simMsAcc / fpsN, drawMs: drawMsAcc / fpsN, ticksPerFrame: ticksAcc / fpsN, worstMs, tps: perf.tps }; if (tt - tpsStart >= 500) { perf.tps = tpsTicks * 1000 / (tt - tpsStart); tpsStart = tt; tpsTicks = 0; } }
      window.__GD_PERF__ = perf; fpsAcc = fpsN = simMsAcc = drawMsAcc = ticksAcc = 0;
      if (now - statAt > 2000) worstMs = 0;
      statAt = now; updateStats();
    }
  }

  // ---------- self tests (all run on the real WASM build, slot 0) ----------
  function jumpProfile(sp) {
    w.gd_reset(0, 0, sp); w.gd_step(0, 1); let apex = 0, n = 0, xPrev = w.gd_x(0);
    for (;;) { xPrev = w.gd_x(0); w.gd_step(0, 0); n++; if (w.gd_on_ground(0)) break; apex = Math.max(apex, w.gd_y(0)); if (n > 5000) break; }
    return [apex / UPB, n, xPrev / UPB];
  }
  // Deliver one click at `clickTs` to a Pipeline running on virtual 60 fps frames, the way a browser does:
  // the event is dispatched just before the rAF callback of the first frame that starts after it.
  // Returns the tick at which the input first took effect, and how many ticks were already simulated
  // when the click was delivered (= the first tick of the frame that sampled it).
  function virtualClick(cbf, clickTs) {
    w.gd_reset(0, 0, 1); const p = new Pipeline(h => w.gd_step(0, h ? 1 : 0), 0); p.cbf = cbf; let sent = false, prev = 0, ticksAtDelivery = -1;
    for (let i = 0; i <= 12; i++) {
      const f = i * 1000 / 60;
      if (!sent && clickTs > prev && clickTs <= f) { ticksAtDelivery = p.ticks; p.setHeld(true, clickTs, f); sent = true; }
      p.beginFrame(f); prev = f;
    }
    return { first: p.firstHeldTick, ticksAtDelivery };
  }
  function runTests() {
    const out = []; const ok = (name, pass, detail) => out.push('<div class="' + (pass ? 'pass' : 'fail') + '">' + (pass ? 'PASS' : 'FAIL') + ' ' + name + ' <span class="dim">' + detail + '</span></div>');
    w.gd_reset(0, 0, 1); w.gd_run_parity(0, PARITY_TICKS); const h = hex(w, 0);
    ok('parity browser==native', h === GOLDEN_PARITY_HASH, h);
    w.gd_reset(0, 0, 1); for (let i = 0; i < TICK_HZ; i++) w.gd_step(0, 0);
    const bps = w.gd_x(0) / UPB; ok('1x = 10.386 blk/s', Math.abs(bps - 10.386) < 0.001, bps.toFixed(4));
    SPEED_LABELS.forEach((lab, sp) => {
      const [apex, ticks, dist] = jumpProfile(sp), r = JUMP_REF[sp];
      ok('jump ' + lab, ticks === r[1] && Math.abs(apex - r[0]) < 0.01 && Math.abs(dist - r[2]) < 0.08,
         'apex ' + apex.toFixed(3) + '/' + r[0] + '  ticks ' + ticks + '/' + r[1] + '  dist ' + dist.toFixed(2) + '/' + r[2]);
    });
    const j1 = jumpProfile(1)[0]; ok('1x apex vs published 2.1333', Math.abs(j1 - WIKI_JUMP) < 0.005, j1.toFixed(4));
    w.gd_reset(0, 0, 1); w.gd_run_parity(0, 5000); const a = hex(w, 0); w.gd_reset(0, 0, 1); w.gd_run_parity(0, 5000); ok('deterministic', a === hex(w, 0), a);
    ok('2.1 not available yet', w.gd_reset(0, 1, 1) === 0, 'expected');

    // extrapolation: predicted state == real stepping, and never changes the sim
    w.gd_reset(0, 0, 1); w.gd_step(0, 1); for (let i = 0; i < 5; i++) w.gd_step(0, 0);
    const hb = hex(w, 0), ex = [w.gd_extrap_x(0, 12), w.gd_extrap_y(0, 12)], pure = hb === hex(w, 0);
    for (let i = 0; i < 12; i++) w.gd_step(0, 0);
    const err = Math.max(Math.abs(ex[0] - w.gd_x(0)), Math.abs(ex[1] - w.gd_y(0)));
    ok('extrapolation = real stepping (12 ticks)', err < 1e-6 && pure, 'max error ' + err.toExponential(1) + ' units; sim untouched: ' + pure);

    // click-between-frames on virtual time: 60 fps frames, click lands 7.3 ms into a 16.7 ms frame
    const click = 100 + 7.3, want = Math.ceil(click / TICK_MS);
    const on = virtualClick(true, click), off = virtualClick(false, click);
    ok('CBF on: input lands on the click\'s own tick', on.first === want, 'tick ' + on.first + ' (expected ' + want + '; click at ' + click.toFixed(1) + ' ms)');
    ok('CBF off: input applies from the frame\'s first tick (vanilla)', off.first === off.ticksAtDelivery && off.first <= on.first,
       'tick ' + off.first + ' = start of that frame, ' + ((on.first - off.first) * TICK_MS).toFixed(1) + ' ms before the real click');
    const counts = [30, 60, 144, 240].map(fps => { let tc = 0; const q = new Pipeline(() => tc++, 0); for (let i = 0; i <= fps; i++) q.beginFrame(i * 1000 / fps); return tc; });
    ok('240 physics ticks/s at 30/60/144/240 render fps', counts.every(c => Math.abs(c - 240) <= 1), counts.join(' / ') + ' ticks in 1 s');
    // very high render rates on virtual time: physics still 240/s, and EVERY frame draws a new smooth position
    for (const fps of [480, 1000]) {
      w.gd_reset(0, 0, 1); let tc = 0; const q = new Pipeline(hh => { w.gd_step(0, 0); tc++; }, 0); const xs = []; let smooth = true;
      for (let i = 0; i <= fps; i++) { const f = i * 1000 / fps; q.beginFrame(f); xs.push(w.gd_extrap_x(0, Math.max(0, (f - q.lastTickTime) / q.stepMs))); }
      const distinct = new Set(xs).size; for (let i = 1; i < xs.length; i++) if (!(xs[i] > xs[i - 1])) smooth = false;
      ok(fps + ' fps: 240 ticks/s, every frame a new position', Math.abs(tc - 240) <= 1 && distinct === xs.length && smooth, tc + ' ticks, ' + distinct + '/' + xs.length + ' distinct positions, strictly increasing: ' + smooth);
    }
    $('tests').innerHTML = out.join('');
  }
  $('test').onclick = runTests;

  w.gd_reset(0, 0, 1); w.gd_run_parity(0, PARITY_TICKS);       // headless hook used by scripts/parity.mjs
  window.__GD_RESULT__ = { hash: hex(w, 0), ticks: w.gd_tick(0) };
  reset(); refresh(); runTests(); requestAnimationFrame(frame);
})();
</script>
