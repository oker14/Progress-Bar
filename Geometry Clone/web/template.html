<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Geometry Clone</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1020; color: #dfe6ff; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { display: grid; grid-template-rows: 1fr 282px; height: 100%; }
  #c { width: 100%; height: 100%; display: block; contain: strict; }
  #panel { box-sizing: border-box; height: 282px; padding: 6px 12px; background: #070914; border-top: 1px solid #263; overflow: hidden; contain: strict; }
  #stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0 12px; height: 74px; overflow: hidden; }
  #stats span b { color: #ffd84a; font-weight: normal; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 4px; }
  button { background: #1c2450; color: #dfe6ff; border: 1px solid #3a4890; border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button.on { background: #3a4890; border-color: #8fa2ff; }
  #tests { height: 130px; overflow: auto; font-size: 12px; }
  .pass { color: #5f5; } .fail { color: #f55; } .dim { color: #7f8bb8; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="panel">
    <div id="stats"></div>
    <div class="row" id="speeds"></div>
    <div class="row">
      <button id="reset">Reset (R)</button><button id="pause">Pause (P)</button><button id="slow">Slow-mo (S)</button>
      <button id="qual">Quality: High (Q)</button><button id="test">Self-tests</button>
      <span class="dim">SPACE / click / touch = jump (hold to re-jump)</span>
    </div>
    <div id="tests"></div>
  </div>
</div>
<script>
// Single self-contained file: physics is the Rust core compiled to WASM, inlined below.
const WASM_B64 = "__WASM_B64__";
const GOLDEN_PARITY_HASH = "__GOLDEN_HASH__";   // native result of the parity script (scripts/golden.json)
const PARITY_TICKS = __PARITY_TICKS__;
const TICK_HZ = 240, TICK_MS = 1000 / TICK_HZ, UPB = 30, WIKI_JUMP = 2.1333;
const SPEED_LABELS = ["0.5x", "1x", "2x", "3x", "4x"];
const SPEED_BPS = [0.7 * 5.98, 0.9 * 5.77, 1.1 * 5.87, 1.3 * 6.0, 1.6 * 6.0].map(v => v * 60 / UPB);   // display only
// Reference cube jump table (docs/03-cube-physics.md): [apex blocks, air ticks, distance blocks]
const JUMP_REF = [[1.955, 100, 3.49], [2.128, 103, 4.457], [2.232, 106, 5.70], [2.147, 103, 6.69], [2.147, 103, 8.24]];
const MAX_CATCHUP_MS = 100;   // never try to "catch up" more than this (tab was hidden / slow frame)
const TRAIL_MAX = 160, TRAIL_EVERY = 4;   // keep every 4th tick (60 Hz) -> at most 160 points

const $ = id => document.getElementById(id);
function b64ToBytes(b64) { const bin = atob(b64), o = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i); return o; }
const hex = (w, i) => (BigInt(w.gd_hash_hi(i) >>> 0) << 32n | BigInt(w.gd_hash_lo(i) >>> 0)).toString(16).padStart(16, '0');

(async () => {
  let w;
  try { w = (await WebAssembly.instantiate(b64ToBytes(WASM_B64), {})).instance.exports; }
  catch (e) { window.__GD_RESULT__ = { error: String(e) }; $('stats').textContent = 'WASM failed: ' + e; return; }

  // ---------- state ----------
  const SIM = 1;                                   // sim slot used by the player; slot 0 = self-tests
  let speed = 1, held = false, paused = false, slow = false, lowQ = false;
  let simNext = performance.now();                 // wall-clock time (ms) at which the next tick is due
  let maxY = 0, lastApex = -1, airTicks = 0, lastAir = -1, wasGround = true, jumps = 0, sinceTrail = 0;
  const trailX = new Float32Array(TRAIL_MAX), trailY = new Float32Array(TRAIL_MAX); let trailN = 0, trailHead = 0;
  // perf counters
  let fpsAcc = 0, fpsN = 0, worstMs = 0, simMsAcc = 0, drawMsAcc = 0, ticksAcc = 0, lastFrame = performance.now(), inputLag = 0;
  let perf = { frameMs: 0, fps: 0, simMs: 0, drawMs: 0, ticksPerFrame: 0, worstMs: 0, inputLagMs: 0 };

  // ---------- canvas (opaque + low latency hint) ----------
  const canvas = $('c');
  let ctx = canvas.getContext('2d', { alpha: false, desynchronized: true }) || canvas.getContext('2d');
  let W = 1, H = 1, ppu = 1, groundY = 0, scale = 1, bg = null;
  function resize() {
    const r = canvas.getBoundingClientRect();
    scale = Math.min(devicePixelRatio || 1, 1.5) * (lowQ ? 0.6 : 1);
    W = Math.max(1, Math.round(r.width * scale)); H = Math.max(1, Math.round(r.height * scale));
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    ppu = Math.min(W, H * 1.6) / 240; groundY = Math.round(H * 0.78);
    buildBackground();
  }
  // Everything that does not move is drawn once into an offscreen canvas and blitted per frame.
  function buildBackground() {
    bg = document.createElement('canvas'); bg.width = W; bg.height = H; const g = bg.getContext('2d', { alpha: false });
    g.fillStyle = '#141a3a'; g.fillRect(0, 0, W, H); g.fillStyle = '#0a0e24'; g.fillRect(0, groundY, W, H - groundY);
    g.font = Math.max(9, 11 * scale) + 'px monospace'; g.lineWidth = Math.max(1, scale);
    for (let gy = 0; gy <= 6; gy++) {
      const y = Math.round(groundY - gy * UPB * ppu) + 0.5;
      g.strokeStyle = gy === 0 ? '#fff' : 'rgba(255,255,255,0.08)'; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
      g.fillStyle = '#6b7ab8'; g.fillText(gy + ' blk', 4 * scale, y - 3 * scale);
    }
    const yw = Math.round(groundY - WIKI_JUMP * UPB * ppu) + 0.5;
    g.setLineDash([6 * scale, 6 * scale]); g.strokeStyle = '#ff6'; g.beginPath(); g.moveTo(0, yw); g.lineTo(W, yw); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#ff6'; g.fillText('wiki jump 2.1333', W - 125 * scale, yw - 3 * scale);
  }
  addEventListener('resize', resize); resize();

  // ---------- simulation clock: ticks are driven by wall time, and by input timestamps ----------
  function tickOnce() {
    w.gd_step(SIM, held ? 1 : 0);
    const y = w.gd_y(SIM), g = w.gd_on_ground(SIM) === 1;
    if (!g) {
      airTicks++; if (y > maxY) maxY = y;
      if (++sinceTrail >= TRAIL_EVERY) { sinceTrail = 0; trailX[trailHead] = w.gd_x(SIM); trailY[trailHead] = y; trailHead = (trailHead + 1) % TRAIL_MAX; if (trailN < TRAIL_MAX) trailN++; }
    }
    if (g && !wasGround) { lastApex = maxY / UPB; lastAir = airTicks; maxY = 0; jumps++; }
    if (wasGround && !g) { airTicks = 1; maxY = y; trailN = 0; trailHead = 0; sinceTrail = 0; }
    if (g && wasGround) airTicks = 0;
    wasGround = g;
  }
  // Run every tick that is due up to wall-clock time `t`. Returns ticks run.
  function advanceTo(t) {
    if (paused) { simNext = t; return 0; }
    if (t - simNext > MAX_CATCHUP_MS) simNext = t - TICK_MS;   // resync after a stall instead of spiralling
    let n = 0;
    const step = slow ? TICK_MS * 10 : TICK_MS;
    while (simNext <= t) { tickOnce(); simNext += step; n++; }
    return n;
  }
  // Input is applied at its own timestamp: first simulate up to the event with the OLD input state,
  // then flip the input. Even if the browser delivered the event late, the jump lands on the right tick.
  function setHeld(v, ts) {
    if (held === v) return;
    const now = performance.now(), t = Math.min(ts || now, now);
    advanceTo(t); held = v; inputLag = now - t;
  }
  function reset() { w.gd_reset(SIM, 0, speed); maxY = 0; lastApex = -1; lastAir = -1; airTicks = 0; wasGround = true; jumps = 0; trailN = 0; trailHead = 0; sinceTrail = 0; simNext = performance.now(); }

  // ---------- UI ----------
  SPEED_LABELS.forEach((label, v) => { const b = document.createElement('button'); b.textContent = label; b.dataset.v = v; b.onclick = () => { speed = v; reset(); refresh(); }; $('speeds').appendChild(b); });
  function refresh() {
    [...$('speeds').children].forEach(b => b.classList.toggle('on', +b.dataset.v === speed));
    $('pause').classList.toggle('on', paused); $('slow').classList.toggle('on', slow);
    $('qual').textContent = 'Quality: ' + (lowQ ? 'Low' : 'High') + ' (Q)'; $('qual').classList.toggle('on', lowQ);
  }
  const togglePause = () => { paused = !paused; refresh(); };
  const toggleSlow = () => { slow = !slow; refresh(); };
  const toggleQual = () => { lowQ = !lowQ; resize(); refresh(); };
  $('reset').onclick = reset; $('pause').onclick = togglePause; $('slow').onclick = toggleSlow; $('qual').onclick = toggleQual;
  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); setHeld(true, e.timeStamp); }
    else if (e.code === 'KeyR') reset(); else if (e.code === 'KeyP') togglePause(); else if (e.code === 'KeyS') toggleSlow(); else if (e.code === 'KeyQ') toggleQual();
    else if (e.code >= 'Digit1' && e.code <= 'Digit5') { speed = +e.code.slice(5) - 1; reset(); refresh(); }
  });
  addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') setHeld(false, e.timeStamp); });
  canvas.addEventListener('pointerdown', e => setHeld(true, e.timeStamp), { passive: true });
  addEventListener('pointerup', e => setHeld(false, e.timeStamp), { passive: true });
  addEventListener('pointercancel', e => setHeld(false, e.timeStamp), { passive: true });
  addEventListener('blur', () => setHeld(false));
  document.addEventListener('visibilitychange', () => { simNext = performance.now(); lastFrame = simNext; });

  // stats: fixed set of nodes, text only rewritten when it changes, at ~8 Hz
  const keys = ['tick', 'time', 'distance', 'x speed', 'height', 'y velocity', 'on ground', 'last apex', 'air time', 'jumps', 'hash', 'fps / frame', 'sim / draw', 'ticks/frame', 'worst frame', 'input->sim'];
  const valEl = {}; keys.forEach(k => { const s = document.createElement('span'); s.append(k + ': '); const b = document.createElement('b'); s.append(b); $('stats').append(s); valEl[k] = b; });
  const prevTxt = {}; function put(k, v) { if (prevTxt[k] !== v) { prevTxt[k] = v; valEl[k].textContent = v; } }
  function updateStats() {
    const t = w.gd_tick(SIM);
    put('tick', t); put('time', (t / TICK_HZ).toFixed(3) + ' s'); put('distance', (w.gd_x(SIM) / UPB).toFixed(2) + ' blk');
    put('x speed', SPEED_BPS[speed].toFixed(3) + ' blk/s'); put('height', (w.gd_y(SIM) / UPB).toFixed(3) + ' blk'); put('y velocity', w.gd_vy(SIM).toFixed(3));
    put('on ground', w.gd_on_ground(SIM) ? 'yes' : 'no');
    put('last apex', lastApex < 0 ? '-' : lastApex.toFixed(4) + ' (' + (lastApex - WIKI_JUMP >= 0 ? '+' : '') + (lastApex - WIKI_JUMP).toFixed(4) + ')');
    put('air time', lastAir < 0 ? '-' : lastAir + ' ticks'); put('jumps', jumps); put('hash', hex(w, SIM));
    put('fps / frame', perf.fps.toFixed(0) + ' / ' + perf.frameMs.toFixed(1) + ' ms'); put('sim / draw', perf.simMs.toFixed(2) + ' / ' + perf.drawMs.toFixed(2) + ' ms');
    put('ticks/frame', perf.ticksPerFrame.toFixed(1)); put('worst frame', perf.worstMs.toFixed(1) + ' ms'); put('input->sim', perf.inputLagMs.toFixed(1) + ' ms');
  }

  // ---------- drawing: one blit + one grid path + one trail path + one rect ----------
  function draw() {
    ctx.drawImage(bg, 0, 0);
    const camX = w.gd_x(SIM) - W * 0.25 / ppu, step = UPB * ppu;
    if (!lowQ) {
      ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = Math.max(1, scale); ctx.beginPath();
      for (let gx = Math.floor(camX / UPB) * UPB; ; gx += UPB) { const x = Math.round((gx - camX) * ppu) + 0.5; if (x > W) break; ctx.moveTo(x, 0); ctx.lineTo(x, groundY); }
      ctx.stroke();
      if (trailN > 1) {
        ctx.strokeStyle = '#4af'; ctx.lineWidth = 2 * scale; ctx.beginPath(); const half = 15 * ppu;
        for (let i = 0; i < trailN; i++) { const k = (trailHead - trailN + i + TRAIL_MAX * 2) % TRAIL_MAX; const x = (trailX[k] - camX) * ppu + half, y = groundY - trailY[k] * ppu - half; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
      }
    }
    const cx = Math.round((w.gd_x(SIM) - camX) * ppu), cy = Math.round(groundY - w.gd_y(SIM) * ppu - step), sz = Math.round(step);
    ctx.fillStyle = '#ffd84a'; ctx.fillRect(cx, cy, sz, sz);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2 * scale; ctx.strokeRect(cx, cy, sz, sz);
  }

  // ---------- main loop ----------
  let statAt = 0;
  function frame(now) {
    const t0 = performance.now();
    const n = advanceTo(now > t0 ? t0 : now);          // rAF timestamp can be slightly ahead of now()
    const t1 = performance.now();
    draw();
    const t2 = performance.now();
    // perf accounting (cheap running averages)
    const fdt = now - lastFrame; lastFrame = now;
    if (fdt > 0 && fdt < 1000) { fpsAcc += fdt; fpsN++; if (fdt > worstMs) worstMs = fdt; }
    simMsAcc += t1 - t0; drawMsAcc += t2 - t1; ticksAcc += n;
    if (now - statAt > 125) {
      if (fpsN) perf = { frameMs: fpsAcc / fpsN, fps: 1000 * fpsN / fpsAcc, simMs: simMsAcc / fpsN, drawMs: drawMsAcc / fpsN, ticksPerFrame: ticksAcc / fpsN, worstMs, inputLagMs: inputLag };
      window.__GD_PERF__ = perf; fpsAcc = fpsN = simMsAcc = drawMsAcc = ticksAcc = 0;
      if (now - statAt > 2000) worstMs = 0;
      statAt = now; updateStats();
    }
    requestAnimationFrame(frame);
  }

  // ---------- self tests (all run on the real WASM build, slot 0) ----------
  function jumpProfile(sp) {
    w.gd_reset(0, 0, sp); w.gd_step(0, 1); let apex = 0, n = 0, xPrev = w.gd_x(0);
    for (;;) { xPrev = w.gd_x(0); w.gd_step(0, 0); n++; if (w.gd_on_ground(0)) break; apex = Math.max(apex, w.gd_y(0)); if (n > 5000) break; }
    return [apex / UPB, n, xPrev / UPB];
  }
  function runTests() {
    const out = []; const ok = (name, pass, detail) => out.push('<div class="' + (pass ? 'pass' : 'fail') + '">' + (pass ? 'PASS' : 'FAIL') + ' ' + name + ' <span class="dim">' + detail + '</span></div>');
    w.gd_reset(0, 0, 1); w.gd_run_parity(0, PARITY_TICKS); const h = hex(w, 0);
    ok('parity browser==native', h === GOLDEN_PARITY_HASH, h);
    w.gd_reset(0, 0, 1); for (let i = 0; i < TICK_HZ; i++) w.gd_step(0, 0);
    const bps = w.gd_x(0) / UPB; ok('1x = 10.386 blk/s', Math.abs(bps - 10.386) < 0.001, bps.toFixed(4));
    SPEED_LABELS.forEach((lab, sp) => {
      const [apex, ticks, dist] = jumpProfile(sp), r = JUMP_REF[sp];
      ok('jump ' + lab, ticks === r[1] && Math.abs(apex - r[0]) < 0.01 && Math.abs(dist - r[2]) < 0.08,
         'apex ' + apex.toFixed(3) + '/' + r[0] + '  ticks ' + ticks + '/' + r[1] + '  dist ' + dist.toFixed(2) + '/' + r[2]);
    });
    const j1 = jumpProfile(1)[0]; ok('1x apex vs published 2.1333', Math.abs(j1 - WIKI_JUMP) < 0.005, j1.toFixed(4));
    w.gd_reset(0, 0, 1); w.gd_run_parity(0, 5000); const a = hex(w, 0); w.gd_reset(0, 0, 1); w.gd_run_parity(0, 5000); ok('deterministic', a === hex(w, 0), a);
    ok('2.1 not available yet', w.gd_reset(0, 1, 1) === 0, 'expected');
    $('tests').innerHTML = out.join('');
  }
  $('test').onclick = runTests;

  w.gd_reset(0, 0, 1); w.gd_run_parity(0, PARITY_TICKS);       // headless hook used by scripts/parity.mjs
  window.__GD_RESULT__ = { hash: hex(w, 0), ticks: w.gd_tick(0) };
  reset(); refresh(); runTests(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
